<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 56 56" width="512" height="512">
  <title>Dapi</title>
  <!-- Draws itself on a loop: stem, top arc, bottom arc, tick; holds; fades; again. -->
  <style>
    path { stroke-dasharray: 1 2; stroke-dashoffset: 1; }
    .s { animation: s 5s cubic-bezier(.6,0,.2,1) infinite; }
    .e { animation: e 5s cubic-bezier(.6,0,.2,1) infinite; }
    .d { animation: d 5s cubic-bezier(.6,0,.2,1) infinite; }
    .t { animation: t 5s cubic-bezier(.5,0,.15,1) infinite; }
    @keyframes s { 0% { stroke-dashoffset: 1; opacity: 0 } 1% { opacity: 1 } 10% { stroke-dashoffset: 0 } 86% { stroke-dashoffset: 0; opacity: 1 } 95%, 100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes e { 0%, 8% { stroke-dashoffset: 1; opacity: 0 } 9% { opacity: 1 } 18% { stroke-dashoffset: 0 } 86% { stroke-dashoffset: 0; opacity: 1 } 95%, 100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes d { 0%, 15% { stroke-dashoffset: 1; opacity: 0 } 16% { opacity: 1 } 29% { stroke-dashoffset: 0 } 86% { stroke-dashoffset: 0; opacity: 1 } 95%, 100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes t { 0%, 28% { stroke-dashoffset: 1; opacity: 0 } 29% { opacity: 1 } 39% { stroke-dashoffset: 0 } 86% { stroke-dashoffset: 0; opacity: 1 } 95%, 100% { stroke-dashoffset: 0; opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { path { animation: none !important; stroke-dashoffset: 0; opacity: 1 } }
  </style>
  <mask id="halo" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <rect width="64" height="64" fill="#fff"/>
    <path class="t" pathLength="1" d="M27 36.5L32.5 42L52 14" stroke="#000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </mask>
  <g mask="url(#halo)" fill="none" stroke-width="11">
    <path class="s" pathLength="1" d="M14 50V14" stroke="#6A4CFF" stroke-linecap="round"/>
    <path class="e" pathLength="1" d="M23 14H32A18 18 0 0 1 46.70 21.61" stroke="#F12727"/>
    <path class="d" pathLength="1" d="M46.70 21.61A18 18 0 0 1 32 50H23" stroke="#12B5A5"/>
  </g>
  <path class="t" pathLength="1" d="M27 36.5L32.5 42L52 14" stroke="#9AD82B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
