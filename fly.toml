# Fly.io: Dapi's public demo (see Dockerfile and DEPLOY.md). Secrets are set with
# `fly secrets set` (MODEL_API_KEY, APIFY_TOKEN, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET,
# SESSION_SECRET), never here.
app = "dapi"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  DAPI_PUBLIC = "1"
  DAPI_JOBS_DIR = "/data/jobs"

# Jobs and their rows live here, across restarts and deploys.
[[mounts]]
  source = "dapi_jobs"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # A job runs for minutes with no web traffic: the machine must not stop under it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
