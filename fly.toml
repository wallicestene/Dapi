# Fly.io: the public, read-only copy (see Dockerfile). Secrets are set with
#   fly secrets set APIFY_TOKEN=<a token that can only read the dapi-evidence store>
app = "dapi"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
